name: Save GA4 realtime snapshot

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ga4-realtime-snapshot
  cancel-in-progress: false

jobs:
  save-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify required secret
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repository secret is missing."
            exit 1
          fi

      - name: Fetch GA4 realtime data and save MongoDB snapshot
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-all-errors \
            --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Accept: application/json" \
            https://www.readalquran.online/api/cron/analytics-realtime-snapshot
