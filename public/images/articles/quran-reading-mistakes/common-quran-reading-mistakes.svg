<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Common Quran Reading Mistakes</title>
  <desc id="desc">A high-quality green and gold Islamic article cover with a centered title, lantern, Quran on a wooden stand, prayer beads, and correction notebook.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#062f2b"/>
      <stop offset="0.55" stop-color="#0b4a42"/>
      <stop offset="1" stop-color="#102d2c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0ae"/>
      <stop offset="0.45" stop-color="#d9a943"/>
      <stop offset="1" stop-color="#8f5c16"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a5129"/>
      <stop offset="0.5" stop-color="#4f2915"/>
      <stop offset="1" stop-color="#2c160d"/>
    </linearGradient>
    <radialGradient id="light" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd978" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ffd978" stop-opacity="0"/>
    </radialGradient>
    <pattern id="pattern" width="54" height="54" patternUnits="userSpaceOnUse">
      <path d="M27 2 38 16 52 27 38 38 27 52 16 38 2 27 16 16Z" fill="none" stroke="#d8aa4d" stroke-opacity=".12" stroke-width="1"/>
      <circle cx="27" cy="27" r="5" fill="none" stroke="#d8aa4d" stroke-opacity=".1"/>
    </pattern>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#pattern)"/>
  <circle cx="1060" cy="92" r="200" fill="#f4d68b" opacity=".09"/>
  <circle cx="130" cy="525" r="230" fill="#0b1d1b" opacity=".35"/>

  <path d="M210 42 H990 Q1020 42 1020 72 V482 Q1020 520 982 520 H218 Q180 520 180 482 V72 Q180 42 210 42Z"
