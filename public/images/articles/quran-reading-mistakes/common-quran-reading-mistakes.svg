    <text x="133" y="69" fill="#4a3c28" font-family="Arial, sans-serif" font-size="18">Check pronunciation</text>
    <text x="133" y="95" fill="#4a3c28" font-family="Arial, sans-serif" font-size="18">Review and correct</text>
    <path d="M358 88 l54-68 10 8-54 68Z" fill="#164b40" stroke="#d7a64c" stroke-width="2"/>
