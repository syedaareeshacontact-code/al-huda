  <path d="M243 58 H957 Q991 58 991 91 V461 Q991 495 957 495 H243 Q209 495 209 461 V91 Q209 58 243 58Z"
        fill="none" stroke="#f5d47b" stroke-opacity=".32" stroke-width="1.5"/>

  <g transform="translate(600 90)" fill="none" stroke="#e7bd61" stroke-width="3">
    <path d="M0-26 C-18-10-20 4 0 20 C20 4 18-10 0-26Z"/>
    <path d="M-30-2 C-17-18-5-17 0 0 C5-17 17-18 30-2 C18 9 9 13 0 21 C-9 13-18 9-30-2Z"/>
