  <text x="600" y="252" text-anchor="middle" fill="#fff8e8" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="700">Quran Reading</text>
  <text x="600" y="324" text-anchor="middle" fill="#fff8e8" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="700">Mistakes</text>
  <path d="M380 354 H820" stroke="#d8a84c" stroke-width="2"/>
  <path d="M586 354 l14-9 14 9-14 9Z" fill="#d8a84c"/>
  <text x="600" y="405" text-anchor="middle" fill="#efc970" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="600">How to Identify, Correct and Avoid Them</text>

