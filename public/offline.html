<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#09090b" />
    <title>Read al Quran — Offline</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #09090b; color: #fafafa; }
      main { width: min(32rem, calc(100% - 2rem)); padding: 2rem; box-sizing: border-box; border: 1px solid #3f3f46; border-radius: 1.25rem; background: #141419; text-align: center; }
      h1 { margin: 0 0 .75rem; color: #dbb84a; }
      p { color: #a1a1aa; line-height: 1.6; }
      button { margin-top: .75rem; border: 0; border-radius: .75rem; padding: .75rem 1rem; background: #c9a227; color: #09090b; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>Reconnect to load this page. Already downloaded Quran audio and files remain available on your device.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
